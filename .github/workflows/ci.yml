name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit and API tests (no model, no network)
        run: python -m pytest -q
      - name: Evaluation (rules baseline)
        run: python eval/run_eval.py --methods rules --out eval/ci && cat eval/ci/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check the web client parses
        run: node --check web/app.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fineprint .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name fp fineprint
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q FinePrint
          curl -sf -F "text=$(cat data/samples/s01_personal_loan.txt)" localhost:8000/api/extract | grep -q clause_count
          docker logs fp
