# Render Blueprint: in Render, choose New > Blueprint, pick this repository, and fill in the secret values.
services:
  - type: web
    name: fineprint
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
